[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "creditlab"
version = "1.0.0"
description = "Credit rate cards learned and evaluated off-policy from a randomised interest-rate experiment"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mekky" }]
dependencies = ["numpy>=2.0", "pandas>=2.2", "statsmodels>=0.14", "scikit-learn>=1.5", "matplotlib>=3.10", "pyarrow>=16"]

[project.optional-dependencies]
app = ["streamlit>=1.40"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning", "ignore::UserWarning", "ignore::RuntimeWarning"]
